[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drugshift-uq-research"
version = "1.0.0"
description = "One-click, resumable DrugShift-UQ research pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
 "numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2",
 "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "torch>=2.3,<3",
 "pytest>=8,<10", "tqdm>=4.66,<5"
]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
